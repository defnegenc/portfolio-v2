<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kilim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --side: 0px; --ink: #3a2a20; --page: #f7f4ed; --panel: #f0e9de; --pick: #e6dccb; --hover: var(--hover);
        --card: #fffdf8; --line: #d9ccb4; --on-ink: #fffdf8; --ink-hover: var(--ink-hover); --veil: rgba(247, 244, 237, 0.86);
        --map-land: #c9b99b; --map-dot: #3a2a20;
      }
      /* Dark, as on defne.io: near-black page, warm off-white ink. */
      [data-theme="dark"] {
        --ink: #e8e6e0; --page: #0c0b0a; --panel: #141312; --pick: #2a2723; --hover: #201e1b;
        --card: #161514; --line: #3a352f; --on-ink: #0c0b0a; --ink-hover: #c9c6bf; --veil: rgba(12, 11, 10, 0.8);
        --map-land: #4a443c; --map-dot: #e8e6e0;
      }
      html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; }
      body { font-family: "Geist Mono", ui-monospace, Menlo, monospace; color: var(--ink); }
      body > canvas {
        position: fixed; top: 0; left: var(--side); display: block;
        width: calc(100vw - var(--side)); height: 100vh; touch-action: none;
      }
      canvas.fold {
        position: fixed; top: 0; left: var(--side); width: calc(100vw - var(--side)); height: 100vh;
        pointer-events: none; z-index: 1; visibility: hidden;
      }
      canvas.fold.on { visibility: visible; }
      button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

      .side {
        position: fixed; top: 0; left: 0; bottom: 0; width: var(--side); box-sizing: border-box;
        padding: 28px 16px 40px; overflow-y: auto; background: var(--panel); z-index: 2;
      }
      .side h2 { margin: 0 10px 10px; font-size: 15px; font-weight: 600; }
      .story { margin: 0 0 28px; }
      .story summary { cursor: pointer; padding: 9px 10px; font-size: 15px; font-weight: 600; list-style: none; }
      .story summary::-webkit-details-marker { display: none; }
      .story summary:hover { background: var(--hover); }
      .story[open] summary { background: var(--pick); }
      .story p { margin: 12px 10px 0; font-size: 15px; line-height: 1.55; }
      .story h3 { margin: 24px 10px 0; font-size: 15px; font-weight: 600; }
      .side section + section { margin-top: 32px; }
      .regions { display: flex; flex-direction: column; }
      .card canvas.map { display: block; width: 100%; margin: 4px 0 16px; }
      .card canvas.map[hidden] { display: none; }
      .card p.where { margin: 0 0 8px; }
      .regions button { text-align: left; font-size: 15px; padding: 9px 10px; min-height: 36px; }
      .regions button:hover, .history button:hover { background: var(--hover); }
      .regions button.current, .history button.current { background: var(--pick); }
      .history { display: flex; flex-direction: column; gap: 6px; }
      .history button { display: flex; flex-direction: column; gap: 8px; padding: 10px; text-align: left; font-size: 15px; }
      .history img { display: block; width: 100%; height: auto; }
      .menu { display: none; }
      .look.rest { margin-top: -20px; }
      .look { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 28px; align-items: center; padding-right: 40px; position: relative; }
      .look button { padding: 9px 10px; min-height: 36px; font-size: 15px; }
      .look button:hover { background: var(--hover); }
      .look button.current { background: var(--pick); }
      .look .theme { position: absolute; top: 0; right: 0; width: 36px; display: grid; place-items: center; padding: 0; }

      .style {
        position: fixed; left: var(--side); right: 0; display: flex; justify-content: center; gap: 8px; pointer-events: none; z-index: 2;
      }
      .style button { pointer-events: auto; font: 600 16px/1 "Geist Mono", ui-monospace, Menlo, monospace; padding: 10px 12px; min-height: 36px; }
      .style button:hover { background: var(--hover); }
      .style button:not(.weave) { background: var(--veil); }
      .style button:not(.weave):hover { background: var(--hover); }
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

      .card {
        position: fixed; width: 300px; box-sizing: border-box; padding: 22px 24px 24px;
        background: var(--card); border: 1px solid var(--line);
        opacity: 0; transform: translateY(6px); transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none; z-index: 3;
      }
      .card.open { opacity: 1; transform: none; pointer-events: auto; }
      .card h2 { margin: 0 32px 10px 0; font-size: 20px; font-weight: 600; line-height: 1.25; }
      .card p { margin: 0; font-size: 15px; font-weight: 400; line-height: 1.55; }
      .card p.with { margin-top: 12px; }
      /* A whole rug's meaning: its motifs arrive one by one, then what they say together. */
      .card .parts { list-style: none; margin: 4px 0 16px; padding: 0; display: flex; flex-direction: column; gap: 12px; }
      .card .parts li {
        display: flex; flex-direction: column; gap: 4px; font-size: 15px; line-height: 1.45;
        opacity: 0; transform: translateY(4px); animation: part-in 0.5s ease forwards; animation-delay: calc(var(--i) * 0.5s + 0.15s);
      }
      .card .parts .head { display: flex; align-items: center; gap: 8px; }
      .card .parts canvas { flex: none; image-rendering: pixelated; outline: 1px solid var(--line); outline-offset: 0; }
      .card .parts b { font-weight: 600; }
      .card .parts p { margin: 0; }
      .card p.with a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
      .card.whole > p.body { opacity: 0; animation: part-in 0.6s ease forwards; animation-delay: calc(var(--n) * 0.5s + 0.35s); }
      @keyframes part-in { to { opacity: 1; transform: none; } }
      .card .act {
        position: static; width: auto; height: auto; margin-top: 18px; padding: 10px 14px; min-height: 36px;
        font: 600 15px/1.2 "Geist Mono", ui-monospace, Menlo, monospace; background: var(--ink); color: var(--on-ink);
      }
      .card .act:hover { background: var(--ink-hover); }
      /* English by default; hover (or tap) shows the Turkish. */
      .tr { text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: help; white-space: nowrap; }
      .tr.turkish { text-decoration-style: solid; }
      .card .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
      .card .acts .act { margin-top: 0; }
      .card .act.pull { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
      .card .act.pull:hover { background: var(--hover); }
      .style .weave { background: var(--ink); color: var(--on-ink); }
      .style .weave:hover { background: var(--ink-hover); }
      .card button[aria-label="Close"] { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; font: 400 22px/1 "Geist Mono", monospace; }

      @media (max-width: 760px) {
        :root { --side: 0px; }
        .side { width: 280px; padding-top: 72px; transform: translateX(-100%); transition: transform 0.3s ease; }
        .side.open { transform: none; }
        .menu { display: block; position: fixed; top: 12px; left: 12px; z-index: 3; font-size: 15px; font-weight: 600; padding: 10px 12px; background: var(--panel); }
      }
      .all {
        position: fixed; top: 16px; right: 16px; z-index: 4; padding: 10px 14px; min-height: 36px;
        font: 600 15px/1 "Geist Mono", ui-monospace, Menlo, monospace; background: var(--veil);
      }
      .all:hover { background: var(--hover); }
      .gallery {
        position: fixed; inset: 0; z-index: 3; overflow-y: auto; background: var(--page);
        padding: 72px 48px 64px; box-sizing: border-box;
      }
      .gallery[hidden] { display: none; }
      .gallery h2 { margin: 0 0 16px; font-size: 15px; font-weight: 600; }
      .gallery h2.mine-title { margin-top: 48px; }
      .gallery .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 32px 24px; }
      .gallery .grid button { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-size: 15px; }
      .gallery .grid button:hover { background: var(--hover); }
      .gallery .grid button.current { background: var(--pick); }
      .gallery .grid canvas, .gallery .grid img { display: block; max-width: 100%; height: auto; }
      .gallery .grid .shot { height: 180px; display: grid; place-items: center; }
      .gallery .grid .shot img, .gallery .grid .shot canvas { max-height: 180px; max-width: 100%; width: auto !important; height: auto !important; }
      @media (max-width: 760px) { .gallery { padding: 72px 16px 48px; } .gallery .grid { grid-template-columns: repeat(2, 1fr); gap: 16px 8px; } .gallery .grid .shot { height: 120px; } .gallery .grid .shot img, .gallery .grid .shot canvas { max-height: 120px; } }
      @media (prefers-reduced-motion: reduce) { .card, .side { transition: none; } .card .parts li, .card.whole > p.body { animation: none; opacity: 1; transform: none; } }
    </style>
    <script type="module" crossorigin src="/kilim/assets/index-CVQZR9H3.js"></script>
  </head>
  <body>
    <canvas aria-label="A kilim. Drag it to pick it up. Pieces on the floor can be thrown, dropped back on the rug, or woven in together. Click a motif to see what it means."></canvas>
    <button type="button" class="all">All rugs</button>
    <section class="gallery" hidden aria-label="All rugs">
      <h2>Regions</h2>
      <div class="grid regions"></div>
      <h2 class="mine-title">Your rugs</h2>
      <div class="grid mine"></div>
    </section>
    <div class="style">
      <button type="button" class="name"></button>
      <button type="button" class="weave" hidden title="Weave the motifs on the floor into this rug, read left to right">Weave them in</button>
    </div>
    <div class="card" role="dialog" aria-live="polite">
      <button type="button" aria-label="Close">×</button>
      <h2></h2>
      <p class="where" hidden></p>
      <canvas class="map" hidden aria-label="Map of Turkey. The red square is where this style is woven; click another to weave one from there."></canvas>
      <ol class="parts" hidden></ol>
      <p class="body"></p>
      <p class="with" hidden></p>
      <div class="acts">
        <button type="button" class="act" hidden>Build a rug around it</button>
      </div>
    </div>
  </body>
</html>
